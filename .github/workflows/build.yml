name: Build CamelKit (Linux / Windows / macOS / Android)

# Cross-platform desktop builds (Ubuntu, Windows, macOS) and Android APK.
# Automatically tags and cuts:
#   - Beta pre-releases on push to `dev` or `staging` (e.g. v0.0.1-beta.42) -> triggers Beta updater
#   - Full stable releases on push to `main` or explicit `v*` tags (e.g. v0.0.1) -> triggers Stable updater
#   - Test builds on manual workflow_dispatch on feature branches

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - dev
      - main
      - staging

permissions:
  contents: write

jobs:
  get_version:
    name: Determine Release Version & Channel
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      draft: ${{ steps.version.outputs.draft }}
      base_version: ${{ steps.version.outputs.base_version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate version properties
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./packages/client/package.json').version")
          # Strip any existing pre-release suffix from base version for clean stamping
          CLEAN_BASE=$(echo "$BASE_VERSION" | sed 's/-.*//')

          # 1. Manual workflow_dispatch
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            if [[ "${{ github.ref_name }}" == 'dev' || "${{ github.ref_name }}" == 'staging' ]]; then
              DRAFT="false"
              PRERELEASE="true"
              TAG_NAME="v${CLEAN_BASE}-beta.${{ github.run_id }}"
              RELEASE_NAME="CamelKit Beta ${TAG_NAME}"
              FULL_VERSION="${CLEAN_BASE}-beta.${{ github.run_id }}"
            elif [[ "${{ github.ref_name }}" == 'main' ]]; then
              DRAFT="false"
              PRERELEASE="false"
              TAG_NAME="v${CLEAN_BASE}"
              RELEASE_NAME="CamelKit Release v${CLEAN_BASE}"
              FULL_VERSION="${CLEAN_BASE}"
            else
              DRAFT="true"
              PRERELEASE="false"
              TAG_NAME="v${CLEAN_BASE}-test.${{ github.run_id }}"
              RELEASE_NAME="CamelKit Test ${TAG_NAME}"
              FULL_VERSION="${CLEAN_BASE}-test.${{ github.run_id }}"
            fi

          # 2. Push to dev or staging branch (Automated Beta Pre-release)
          elif [[ "${{ github.ref_name }}" == 'dev' || "${{ github.ref_name }}" == 'staging' ]]; then
            DRAFT="false"
            PRERELEASE="true"
            TAG_NAME="v${CLEAN_BASE}-beta.${{ github.run_number }}"
            RELEASE_NAME="CamelKit Beta ${TAG_NAME}"
            FULL_VERSION="${CLEAN_BASE}-beta.${{ github.run_number }}"

          # 3. Push to main branch (Automated Stable Release)
          elif [[ "${{ github.ref_name }}" == 'main' && "${{ github.ref_type }}" == 'branch' ]]; then
            DRAFT="false"
            PRERELEASE="false"
            TAG_NAME="v${CLEAN_BASE}"
            RELEASE_NAME="CamelKit Release v${CLEAN_BASE}"
            FULL_VERSION="${CLEAN_BASE}"

          # 4. Explicit Git Tag push (e.g. v0.0.1 or v0.0.1-beta.1)
          elif [[ "${{ github.ref_type }}" == 'tag' ]]; then
            TAG_NAME="${{ github.ref_name }}"
            FULL_VERSION="${TAG_NAME#v}"
            RELEASE_NAME="CamelKit ${{ github.ref_name }}"
            DRAFT="false"
            if [[ "${FULL_VERSION}" == *"-"* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi

          echo "base_version=${CLEAN_BASE}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"

          echo "Target Version: ${FULL_VERSION}"
          echo "Release Tag: ${TAG_NAME}"
          echo "Channel Pre-release: ${PRERELEASE} (Draft: ${DRAFT})"

  build:
    needs: get_version
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Stamp Package Version
        run: |
          VERSION="${{ needs.get_version.outputs.full_version }}"
          echo "Stamping dynamic version $VERSION into package.json manifests..."
          node -e "
            const fs = require('fs');
            for (const file of ['packages/client/package.json', 'packages/mobile/package.json']) {
              if (fs.existsSync(file)) {
                const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
                pkg.version = process.argv[1];
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
              }
            }
          " "$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The World Map plugin's source of truth is its own repo. Pull BOTH the plugin
      # source and its prebaked icon cache from there so packaged builds bundle the
      # current plugin and ship icons instead of regenerating them at runtime.
      - name: Sync World Map plugin + prebaked cache from repo
        run: |
          git clone --depth 1 https://github.com/atapifire/evillite-worldmap.git /tmp/wm || exit 0
          cp /tmp/wm/src/WorldMapPlugin.ts packages/client/src/renderer/client/plugins/WorldMapPlugin.ts 2>/dev/null || true
          mkdir -p packages/client/src/renderer/client/plugins/data
          cp /tmp/wm/data/*.json packages/client/src/renderer/client/plugins/data/ 2>/dev/null || true

      # Temp core plugins (until the Plugin Hub installs them) also live in their own repos.
      - name: Sync Collection Log plugin from repo
        run: |
          git clone --depth 1 https://github.com/atapifire/evillite-collectionlog.git /tmp/cl || exit 0
          cp /tmp/cl/src/CollectionLogPlugin.ts packages/client/src/renderer/client/plugins/CollectionLogPlugin.ts 2>/dev/null || true

      # Anti-bot guard: fail the build if client/core or any bundled plugin contains an input-fabrication vector.
      - name: Anti-bot guard (no input fabrication)
        run: node scripts/guard-input-fabrication.mjs

      - name: Build core
        run: pnpm --filter @camelkit/core build

      - name: Build client (renderer + main + copy plugin cache)
        env:
          CAMELKIT_CANONICAL: ${{ github.repository == 'CamelKit/Client' }}
          EVILLITE_CANONICAL: ${{ github.repository == 'CamelKit/Client' }}
        run: pnpm --filter @camelkit/client build

      - name: Package (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          EV=$(node -p "require('electron/package.json').version")
          echo "Packaging with electron $EV"
          pnpm --filter @camelkit/client exec electron-builder \
            --${{ matrix.platform }} -c.electronVersion="$EV" --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: camelkit-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            packages/client/dist/*.AppImage
            packages/client/dist/*.deb
            packages/client/dist/*.tar.gz
            packages/client/dist/*.exe
            packages/client/dist/*.dmg
            packages/client/dist/*.zip
            packages/client/dist/*.blockmap
            packages/client/dist/*.yml
            !packages/client/dist/builder-debug.yml

  android:
    needs: get_version
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Stamp Package Version
        run: |
          VERSION="${{ needs.get_version.outputs.full_version }}"
          node -e "
            const fs = require('fs');
            for (const file of ['packages/client/package.json', 'packages/mobile/package.json']) {
              if (fs.existsSync(file)) {
                const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
                pkg.version = process.argv[1];
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
              }
            }
          " "$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync World Map plugin + prebaked cache
        run: |
          git clone --depth 1 https://github.com/atapifire/evillite-worldmap.git /tmp/wm || exit 0
          cp /tmp/wm/src/WorldMapPlugin.ts packages/client/src/renderer/client/plugins/WorldMapPlugin.ts 2>/dev/null || true
          mkdir -p packages/client/src/renderer/client/plugins/data
          cp /tmp/wm/data/*.json packages/client/src/renderer/client/plugins/data/ 2>/dev/null || true

      - name: Sync Collection Log plugin
        run: |
          git clone --depth 1 https://github.com/atapifire/evillite-collectionlog.git /tmp/cl || exit 0
          cp /tmp/cl/src/CollectionLogPlugin.ts packages/client/src/renderer/client/plugins/CollectionLogPlugin.ts 2>/dev/null || true

      - name: Anti-bot guard (no input fabrication)
        run: node scripts/guard-input-fabrication.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build core + renderer
        run: |
          pnpm --filter @camelkit/core build
          pnpm --filter @camelkit/client build

      - name: Build APK (signed release if keystore available, debug fallback)
        working-directory: packages/mobile
        env:
          IS_CANONICAL: ${{ github.repository == 'CamelKit/Client' }}
          IS_PRERELEASE: ${{ needs.get_version.outputs.prerelease }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/build-web.mjs
          npx cap add android
          cp android-template/app/src/main/java/net/evilquest/evillite/*.java \
             android/app/src/main/java/net/evilquest/evillite/
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npx cap sync android
          mkdir -p out-apk

          if [ "$IS_CANONICAL" = "true" ] && [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "Signing canonical release APK with AGP injected keystore..."
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            (cd android && ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD")
            cp android/app/build/outputs/apk/release/app-release.apk out-apk/CamelKit-android.apk
          elif [ "$IS_CANONICAL" = "true" ] && [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::Canonical stable release APK requires signing secrets (ANDROID_KEYSTORE_B64 etc). See docs/release-signing.md. Refusing to ship an unsigned stable release."
            exit 1
          else
            echo "Building debug APK (beta / development build)..."
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk out-apk/CamelKit-android-debug.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camelkit-android
          if-no-files-found: warn
          path: packages/mobile/out-apk/*.apk

  release:
    needs: [build, android, get_version]
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: always() && needs.get_version.result == 'success' && needs.build.result == 'success' && needs.android.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get_version.outputs.tag_name }}
          name: ${{ needs.get_version.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ needs.get_version.outputs.draft == 'true' }}
          prerelease: ${{ needs.get_version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*
            !artifacts/**/builder-debug.yml
          body: |
            Automated ${{ needs.get_version.outputs.prerelease == 'true' && 'Beta Pre-release' || 'Full Release' }} (**${{ needs.get_version.outputs.tag_name }}**).

            ### Installers
            - **Windows** — `CamelKit-Setup-*.exe`
            - **macOS** — `*.dmg` (use `arm64` for Apple Silicon, plain for Intel)
            - **Linux — package:** `*.deb` (`sudo apt install ./CamelKit-*.deb`)
            - **Linux — standalone:** `*.AppImage` or `*.tar.gz`
            - **Android** — `CamelKit-android*.apk`
